apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-custom-alerts
  namespace: monitoring
  labels:
    release: kps

spec:
  groups:
    - name: kubernetes.assignment.rules
      rules:

        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes node is not Ready"
            description: "Node {{ $labels.node }} has been NotReady for more than 2 minutes."

        - alert: ContainerRestartDetected
          expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Container restart detected"
            description: "A container in pod {{ $labels.pod }} restarted during the last 5 minutes."

        - alert: HighNodeCPUUsage
          expr: |
            100 -
            (
              avg by(instance) (
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              ) * 100
            ) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High node CPU usage"
            description: "CPU utilization on {{ $labels.instance }} has exceeded 80% for 5 minutes."