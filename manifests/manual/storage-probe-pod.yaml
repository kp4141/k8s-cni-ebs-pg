apiVersion: v1
kind: Pod
metadata:
  name: probe-pod
  namespace: storage-probe
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo provisioned > /data/probe.txt && sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: probe-pvc